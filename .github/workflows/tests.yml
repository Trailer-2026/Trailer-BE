name: 자체 점검 테스트 (dev PR·push)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  selfcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'  # requirements 가 무겁다(playwright·modal·firebase) — 매번 다시 받지 않는다

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 테스트는 프레임워크 없이 main() 자체 점검 스크립트다(레포에 pytest 설정이 없다).
      # 파일 단위로 실행하고, 하나라도 죽으면 잡을 실패시킨다.
      - name: Run self-check tests
        env:
          # config/properties_dev.ini 가 없는 환경이라 인메모리 SQLite 로 뜨게 한다.
          OPENAPI_EXPORT: "1"
        run: |
          rc=0
          for f in tests/test_*.py; do
            echo "── $f"
            python "$f" || rc=1
          done
          exit $rc
